<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الصيّاد — مساعد الفرص</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f5f6fa;color:#171923}
.wrap{max-width:720px;margin:auto;padding:18px}.hero{background:#171923;color:white;border-radius:22px;padding:22px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:30px}.muted{opacity:.72}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.stat{background:#fff;color:#171923;border-radius:15px;padding:13px}.stat b{display:block;font-size:20px;margin-top:3px}
.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000008}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{padding:5px 9px;border-radius:999px;background:#eef0f5;font-size:12px}.good{background:#e8f7ed;color:#176b36}.money{font-size:23px;font-weight:800}.actions{display:flex;gap:8px;margin-top:12px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer}button.primary{background:#171923;color:white}button.ghost{background:#eef0f5}.empty{text-align:center;padding:24px;color:#707586}
input,select{width:100%;padding:12px;border:1px solid #dddfea;border-radius:12px;margin-top:6px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.section-title{margin:22px 2px 8px;font-size:18px}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="muted">نسخة تجريبية 0.1</div>
    <h1>🎯 الصيّاد</h1>
    <div class="muted">رتّب فرص العمل الصغيرة حسب العائد مقابل الوقت.</div>
    <div class="stats">
      <div class="stat">أرباح اليوم<b id="today">$0.00</b></div>
      <div class="stat">عدد المهام<b id="count">0</b></div>
      <div class="stat">الهدف<b>$20</b></div>
    </div>
  </section>

  <div class="card">
    <b>➕ أضف فرصة وجدتها</b>
    <div class="grid">
      <label>اسم المهمة<input id="name" placeholder="مثال: اختبار موقع"></label>
      <label>الدخل المتوقع ($)<input id="pay" type="number" step="0.01" placeholder="10"></label>
      <label>الوقت بالدقائق<input id="mins" type="number" placeholder="30"></label>
      <label>الرابط (اختياري)<input id="url" placeholder="https://..."></label>
    </div>
    <div class="actions"><button class="primary" onclick="addJob()">إضافة</button><button class="ghost" onclick="clearAll()">مسح الكل</button></div>
  </div>

  <h2 class="section-title">🔥 أفضل الفرص</h2>
  <div id="list"></div>
</div>

<script>
let jobs=JSON.parse(localStorage.getItem('sayad_jobs')||'[]');
function save(){localStorage.setItem('sayad_jobs',JSON.stringify(jobs));render()}
function addJob(){
 const name=document.getElementById('name').value.trim(), pay=+document.getElementById('pay').value, mins=+document.getElementById('mins').value, url=document.getElementById('url').value.trim();
 if(!name||pay<=0||mins<=0){alert('اكتب اسم المهمة والدخل والوقت.');return}
 jobs.push({id:Date.now(),name,pay,mins,url,done:false});save();
 ['name','pay','mins','url'].forEach(x=>document.getElementById(x).value='')
}
function finish(id){const j=jobs.find(x=>x.id===id); if(j){j.done=true; j.doneAt=Date.now(); save()}}
function removeJob(id){jobs=jobs.filter(x=>x.id!==id);save()}
function clearAll(){if(confirm('مسح جميع الفرص؟')){jobs=[];save()}}
function render(){
 const open=jobs.filter(j=>!j.done).sort((a,b)=>(b.pay/b.mins)-(a.pay/a.mins));
 const done=jobs.filter(j=>j.done);
 document.getElementById('count').textContent=done.length;
 document.getElementById('today').textContent='$'+done.reduce((s,j)=>s+j.pay,0).toFixed(2);
 const box=document.getElementById('list');
 if(!open.length){box.innerHTML='<div class="card empty">لا توجد فرص بعد.<br>أضف أول فرصة يدويًا، ثم سنطوّر الأداة لاحقًا لجلب الفرص تلقائيًا.</div>';return}
 box.innerHTML=open.map(j=>{
   const hourly=j.pay/j.mins*60;
   return `<div class="card">
    <div class="row"><b>${esc(j.name)}</b><span class="pill good">$${hourly.toFixed(2)}/ساعة</span></div>
    <div style="margin-top:10px" class="row"><span>${j.mins} دقيقة</span><span class="money">$${j.pay.toFixed(2)}</span></div>
    <div class="actions">
      ${j.url?`<button class="primary" onclick="window.open('${safe(j.url)}','_blank')">فتح المهمة</button>`:''}
      <button class="ghost" onclick="finish(${j.id})">✓ أنجزتها</button>
      <button class="ghost" onclick="removeJob(${j.id})">حذف</button>
    </div>
   </div>`
 }).join('')
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(s){return s.replace(/'/g,"\\'").replace(/[\r\n]/g,'')}
render();
</script>
</body>
</html>
